name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backlogg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/backlogg
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/backlogg_test
      TMDB_API_KEY: ""
      TWITCH_CLIENT_ID: ""
      TWITCH_CLIENT_SECRET: ""
      JWT_SECRET_KEY: "ci-test-secret-key-not-for-prod-32bytes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE backlogg_test"

      - name: Run init.sh
        run: bash init.sh

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Regenerates packages/api-client's OpenAPI document + generated types
      # from the backend's `FastAPI.openapi()` (pure introspection: no DB, no
      # running server needed). Running this BEFORE typecheck means a
      # backend/client contract drift fails the typecheck step below instead
      # of silently passing against a stale, previously-committed schema.
      - name: Generate typed API client from the backend's OpenAPI schema
        run: pnpm --filter @backlogg/api-client gen:api

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Lint
        run: pnpm --filter web lint

      - name: Unit tests (Vitest)
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      # Only Chromium (this is a single smoke test, not a cross-browser
      # suite) — keeps the extra CI time to roughly a browser download plus
      # a couple of seconds of test time.
      - name: Install Playwright's Chromium browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E smoke test (Playwright)
        run: pnpm --filter web e2e
