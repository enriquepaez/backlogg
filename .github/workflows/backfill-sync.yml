name: Backfill content sync

on:
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content type to backfill'
        required: true
        type: choice
        options:
          - movie
          - series
          - book
          - game
      mode:
        description: 'enumerate = fill seed_targets from /discover (movie/series only, feature 86); dump = seed the whole book catalog from the Open Library monthly dumps (book only, feature 87); hydrate = run the sync job in a loop (mass seeding); credits = fill credit holes from the local catalog (issue #15, not for game)'
        required: true
        type: choice
        default: hydrate
        options:
          - enumerate
          - dump
          - hydrate
          - credits
      min_votes:
        description: 'enumerate mode only — vote_count.gte threshold (blank = TMDB_SEED_MIN_VOTES_* default, 25)'
        required: false
        type: string
        default: ''
      recheck:
        description: 'credits mode only — re-visit items already stamped with credits_synced_at'
        required: false
        type: boolean
        default: false
      dump_phase:
        description: 'dump mode only — run a single phase instead of all five: reading-log | editions | works | authors | load (blank = all). Phases already done are skipped unless force_phase is set'
        required: false
        type: string
        default: ''
      force_phase:
        description: 'dump mode only — redo a phase even if its artifact is already in the work dir'
        required: false
        type: boolean
        default: false
      resume:
        description: 'dump mode only — restore the work dir of a PREVIOUS run and continue where it died. Off by default: a plain dump run always starts from the current monthly dump'
        required: false
        type: boolean
        default: false
      seed_top_n:
        description: 'hydrate mode, book/game only — cursor wraparound target, must match SEED_TOP_N_* on Render (inert for movie/series since feature 86)'
        required: false
        type: string
        default: '10000'

# Runs the sync jobs directly against the production database (Neon) and the
# external APIs, bypassing Render's ~15 min per-request timeout. Progress is
# persisted in sync_cursors, so re-dispatching the workflow resumes where the
# previous run stopped. The script stops itself after BACKFILL_TIME_BUDGET
# (default 300 min); timeout-minutes leaves headroom for setup plus the
# iteration in flight when the budget expires.
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      # Wraparound target for the cursor-driven types — must match
      # production's SEED_TOP_N_* (Render), otherwise the shared sync_cursors
      # cursor wraps too early. SEED_TOP_N_MOVIES/_SERIES are inert since
      # feature 86 (movies and series are driven by seed_targets, not by a
      # cursor); they are still exported so the two configurations stay
      # literally identical and nothing drifts unnoticed.
      SEED_TOP_N_MOVIES: ${{ github.event.inputs.seed_top_n }}
      SEED_TOP_N_SERIES: ${{ github.event.inputs.seed_top_n }}
      SEED_TOP_N_BOOKS: ${{ github.event.inputs.seed_top_n }}
      SEED_TOP_N_GAMES: ${{ github.event.inputs.seed_top_n }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Enumeration (feature 86): fills seed_targets from /discover under the
      # vote_count threshold, sliced by release year. Fetches no item detail
      # and writes no catalog row — it only decides *which* items the catalog
      # wants. Must run before the first hydrate of movie/series, and again
      # whenever the threshold changes or new titles cross it (promotion, see
      # docs/seeding-plan.md §6). Exit code 2 = a window hit the 500-page cap
      # and the list is incomplete.
      - name: Enumerate seed targets
        if: ${{ github.event.inputs.mode == 'enumerate' }}
        run: |
          case "${{ github.event.inputs.content_type }}" in
            movie|series) ;;
            *)
              echo "::error::enumerate mode only supports 'movie' and 'series' — books have their own mode=dump (Open Library monthly dumps, feature 87) and games need no enumeration at all (a single IGDB query returns 500 games with every field)"
              exit 1
              ;;
          esac
          uv run python scripts/seed_tmdb_targets.py "${{ github.event.inputs.content_type }}" \
            ${{ github.event.inputs.min_votes != '' && format('--min-votes {0}', github.event.inputs.min_votes) || '' }}

      # Resumability across dispatches: every dispatch gets a fresh runner, so
      # without a restored work dir a run that died in phase 3 would have to
      # re-download the 12,59 GB of editions. The artifacts are a few MB, far
      # below the 10 GB repo cache budget. restore/save rather than plain
      # `cache` so that the artifacts of a run that failed halfway are saved
      # too — that is precisely the run worth resuming.
      #
      # ⚠️ Restoring is OPT-IN (`resume: true`) and that is deliberate. A
      # prefix `restore-keys` would silently hand a *plain* `mode=dump` — the
      # invocation docs/operations.md documents as the normal one — the work
      # dir of an earlier month, and the run would skip all four phases and
      # re-seed the catalog of a stale dump without a word. Fresh by default,
      # resume only when the operator says so.
      - name: Restore Open Library seed work dir
        if: ${{ github.event.inputs.mode == 'dump' && github.event.inputs.resume == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/openlibrary-seed
          key: openlibrary-seed-workdir-${{ github.run_id }}
          restore-keys: openlibrary-seed-workdir-

      # Dump seeding (feature 87): streams the four Open Library monthly dumps
      # (17,5 GB) through memory — not one dump byte is written to disk, which
      # is what makes it fit on a runner with ~14 GB free — and writes the
      # whole book catalog. Phases whose artifact is already in the work dir
      # are skipped. Exit code 2 = the run finished degraded (nothing
      # selected, rejected rows, or external ids that could not be linked).
      - name: Seed books from the Open Library dumps (dump mode)
        if: ${{ github.event.inputs.mode == 'dump' }}
        run: |
          if [ "${{ github.event.inputs.content_type }}" != "book" ]; then
            echo "::error::dump mode is only for 'book' — Open Library is the only source we seed from a full monthly dump"
            exit 1
          fi
          uv run python scripts/seed_openlibrary_books.py \
            --work-dir "${{ runner.temp }}/openlibrary-seed" \
            ${{ github.event.inputs.dump_phase != '' && format('--phase {0}', github.event.inputs.dump_phase) || '' }} \
            ${{ github.event.inputs.force_phase == 'true' && '--force' || '' }}

      - name: Save Open Library seed work dir
        if: ${{ always() && github.event.inputs.mode == 'dump' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/openlibrary-seed
          key: openlibrary-seed-workdir-${{ github.run_id }}

      - name: Run backfill (hydrate mode)
        if: ${{ github.event.inputs.mode == 'hydrate' }}
        run: uv run python scripts/backfill_sync.py "${{ github.event.inputs.content_type }}"

      # Targeted credits backfill (feature 85): the work list comes from a
      # local query over the catalog, not from sync_cursors, so SEED_TOP_N_*
      # is irrelevant here and re-dispatching simply re-computes the gap.
      - name: Run backfill (targeted credits mode)
        if: ${{ github.event.inputs.mode == 'credits' }}
        run: |
          if [ "${{ github.event.inputs.content_type }}" = "game" ]; then
            echo "::error::credits mode is not supported for 'game' — games have no people credits"
            exit 1
          fi
          uv run python scripts/backfill_sync.py "${{ github.event.inputs.content_type }}" \
            --only-missing-credits \
            ${{ github.event.inputs.recheck == 'true' && '--recheck' || '' }}
