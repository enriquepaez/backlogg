name: Nightly content sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# The API runs on a single free Render instance that sleeps when idle and
# cannot handle concurrent syncs, so the service is woken first and the four
# syncs run sequentially in one job.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wake service
        run: |
          curl -sf --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 \
            "${{ secrets.RENDER_API_URL }}/health"

      - name: Sync movies
        if: ${{ !cancelled() }}
        run: |
          curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/admin/sync/movie" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}"

      - name: Sync series
        if: ${{ !cancelled() }}
        run: |
          curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/admin/sync/series" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}"

      - name: Sync books
        if: ${{ !cancelled() }}
        run: |
          curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/admin/sync/book" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}"

      - name: Sync games
        if: ${{ !cancelled() }}
        run: |
          curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/admin/sync/game" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}"

      - name: Verify stats
        if: ${{ !cancelled() }}
        run: |
          curl -sf --max-time 60 "${{ secrets.RENDER_API_URL }}/admin/stats" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}"
