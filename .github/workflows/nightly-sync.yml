name: Nightly content sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# The API runs on a single free Render instance that sleeps when idle and
# cannot handle concurrent syncs, so the service is woken first and the four
# syncs run sequentially in one job.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wake service
        run: |
          curl -sf --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 \
            "${{ secrets.RENDER_API_URL }}/health"

      # people_errors counts items whose credits/cast persistence failed even
      # though the item itself synced (see Issue 7) — surfaced as a warning
      # annotation so it doesn't disappear silently, without failing the job:
      # a degraded sync (item synced, credits missing) is still better than
      # no sync, and the job must keep the "never abort the other syncs"
      # contract (C19).
      - name: Sync movies
        if: ${{ !cancelled() }}
        run: |
          response=$(curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/v1/admin/sync/movie" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "$response" | jq .
          people_errors=$(echo "$response" | jq -r '.people_errors // 0')
          if [ "$people_errors" -gt 0 ]; then
            echo "::warning::sync/movie: $people_errors item(s) failed to persist credits/people"
          fi

      - name: Sync series
        if: ${{ !cancelled() }}
        run: |
          response=$(curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/v1/admin/sync/series" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "$response" | jq .
          people_errors=$(echo "$response" | jq -r '.people_errors // 0')
          if [ "$people_errors" -gt 0 ]; then
            echo "::warning::sync/series: $people_errors item(s) failed to persist credits/people"
          fi

      - name: Sync books
        if: ${{ !cancelled() }}
        run: |
          response=$(curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/v1/admin/sync/book" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "$response" | jq .
          people_errors=$(echo "$response" | jq -r '.people_errors // 0')
          if [ "$people_errors" -gt 0 ]; then
            echo "::warning::sync/book: $people_errors item(s) failed to persist authors"
          fi

      - name: Sync games
        if: ${{ !cancelled() }}
        run: |
          curl -sf --max-time 1800 --retry 2 --retry-delay 60 --retry-all-errors \
            -X POST "${{ secrets.RENDER_API_URL }}/v1/admin/sync/game" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}"

      # Fails if any content type has not synced in the last 2 hours, so a
      # sync that returns 200 without actually updating anything still fails
      # the night.
      - name: Verify stats freshness
        if: ${{ !cancelled() }}
        run: |
          stats=$(curl -sf --max-time 60 "${{ secrets.RENDER_API_URL }}/v1/admin/stats" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}")
          echo "$stats" | jq .
          cutoff=$(date -u -d '2 hours ago' +%s)
          stale=$(echo "$stats" | jq -r --argjson cutoff "$cutoff" '
            to_entries[]
            | select((.value.last_synced_at // "1970-01-01T00:00:00Z"
                | sub("\\.[0-9]+"; "") | fromdateiso8601) <= $cutoff)
            | .key')
          if [ -n "$stale" ]; then
            echo "::error::Content types not synced in the last 2 hours: $stale"
            exit 1
          fi
          echo "All content types synced within the last 2 hours."
