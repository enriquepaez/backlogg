packages:
  - apps/*
  - packages/*

# Build-script approvals (pnpm). Moved here from apps/web by design:
# the workspace root owns a single pnpm config for the whole monorepo.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  # msw's postinstall only copies the browser Service Worker file
  # (`msw init`, for `setupWorker`); these tests use `msw/node`
  # (`setupServer`) exclusively, so the browser worker script isn't needed.
  msw: false
  sharp: false
  unrs-resolver: false
